name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: smoke checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve project root
        id: project-root
        run: |
          if [[ -d trust && -f trust/Makefile ]]; then
            echo "dir=trust" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Install smoke dependencies
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Compile checks
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: python -m compileall adapters telemetry tests launch-gate

      - name: Fast tests
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: pytest -q tests/retrieval tests/secrets tests/tools

  policy:
    name: policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve project root
        id: project-root
        run: |
          if [[ -d trust && -f trust/Makefile ]]; then
            echo "dir=trust" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Run Rego tests and capture report
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: |
          mkdir -p artifacts
          opa test policies/rego policies/tests -v
          opa test policies/retrieval -v
          opa test policies/rego policies/tests --format=json > artifacts/opa-report.json

      - name: Upload policy artifact
        uses: actions/upload-artifact@v4
        with:
          name: opa-policy-report
          path: ${{ steps.project-root.outputs.dir }}/artifacts/opa-report.json

  integration-lite:
    name: integration-lite checks
    runs-on: ubuntu-latest
    needs: [smoke, policy]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve project root
        id: project-root
        run: |
          if [[ -d trust && -f trust/Makefile ]]; then
            echo "dir=trust" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Install test dependencies
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Adapter/telemetry/launch-gate tests
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: |
          pytest -q tests/adapter tests/observability
          pytest -q tests/telemetry
          pytest -q tests/launch-gate
