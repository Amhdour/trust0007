name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

jobs:
  smoke:
    name: smoke checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Resolve project root
        id: project-root
        run: |
          if [[ -d trust && -f trust/Makefile ]]; then
            echo "dir=trust" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Install smoke dependencies
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Compile checks
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: python -m compileall adapters telemetry tests launch-gate

      - name: Fast tests
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: |
          mkdir -p artifacts
          pytest -q tests/retrieval tests/secrets tests/tools --junitxml=artifacts/smoke-junit.xml 2>&1 | tee artifacts/smoke-pytest.log

      - name: Failure triage summary (reason codes)
        if: always()
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: |
          mkdir -p artifacts
          (grep -Eo 'policy\.[A-Za-z0-9_.:-]+' artifacts/smoke-pytest.log | sort | uniq -c | sort -nr || true) > artifacts/reason-codes-summary.txt

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: |
            ${{ steps.project-root.outputs.dir }}/artifacts/smoke-junit.xml
            ${{ steps.project-root.outputs.dir }}/artifacts/smoke-pytest.log
            ${{ steps.project-root.outputs.dir }}/artifacts/reason-codes-summary.txt

  policy:
    name: policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve project root
        id: project-root
        run: |
          if [[ -d trust && -f trust/Makefile ]]; then
            echo "dir=trust" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.0.0

      - name: Run Rego tests and capture report
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: |
          mkdir -p artifacts
          opa test policies/rego policies/tests -v
          opa test policies/retrieval -v
          opa test policies/rego policies/tests --format=json > artifacts/opa-report.json

      - name: Upload policy artifact
        uses: actions/upload-artifact@v4
        with:
          name: opa-policy-report
          path: ${{ steps.project-root.outputs.dir }}/artifacts/opa-report.json

  integration-lite:
    name: integration-lite checks
    runs-on: ubuntu-latest
    needs: [smoke, policy]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Resolve project root
        id: project-root
        run: |
          if [[ -d trust && -f trust/Makefile ]]; then
            echo "dir=trust" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Install test dependencies
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Adapter/telemetry/launch-gate tests
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: |
          mkdir -p artifacts
          pytest -q tests/adapter tests/observability --junitxml=artifacts/integration-adapter-junit.xml
          pytest -q tests/telemetry --junitxml=artifacts/integration-telemetry-junit.xml
          pytest -q tests/launch-gate --junitxml=artifacts/integration-launch-gate-junit.xml
          cat artifacts/integration-*.xml > artifacts/integration-junit.xml

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: |
            ${{ steps.project-root.outputs.dir }}/artifacts/integration-*.xml
            ${{ steps.project-root.outputs.dir }}/artifacts/integration-junit.xml

  dependency-security:
    name: dependency security (SBOM + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Resolve project root
        id: project-root
        run: |
          if [[ -d trust && -f trust/Makefile ]]; then
            echo "dir=trust" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependency security tooling
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit cyclonedx-bom

      - name: Generate SBOM and dependency audit
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: |
          mkdir -p artifacts
          cyclonedx-py environment --output-file artifacts/sbom-cyclonedx.json --output-format JSON
          pip-audit --format json --output artifacts/pip-audit.json || true

      - name: Upload dependency artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-artifacts
          path: |
            ${{ steps.project-root.outputs.dir }}/artifacts/sbom-cyclonedx.json
            ${{ steps.project-root.outputs.dir }}/artifacts/pip-audit.json

  proof-pack:
    name: proof-pack bundle
    runs-on: ubuntu-latest
    needs: [smoke, policy, integration-lite, dependency-security]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve project root
        id: project-root
        run: |
          if [[ -d trust && -f trust/Makefile ]]; then
            echo "dir=trust" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Download smoke artifacts
        uses: actions/download-artifact@v4
        with:
          name: smoke-artifacts
          path: ${{ steps.project-root.outputs.dir }}/artifacts

      - name: Download policy artifacts
        uses: actions/download-artifact@v4
        with:
          name: opa-policy-report
          path: ${{ steps.project-root.outputs.dir }}/artifacts

      - name: Download integration artifacts
        uses: actions/download-artifact@v4
        with:
          name: integration-artifacts
          path: ${{ steps.project-root.outputs.dir }}/artifacts

      - name: Download dependency security artifacts
        uses: actions/download-artifact@v4
        with:
          name: dependency-security-artifacts
          path: ${{ steps.project-root.outputs.dir }}/artifacts

      - name: Build proof pack
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: python scripts/build-proof-pack.py

      - name: Upload proof pack
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-proof-pack
          path: ${{ steps.project-root.outputs.dir }}/artifacts/proof-pack

      - name: Attest reviewer proof pack provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.project-root.outputs.dir }}/artifacts/proof-pack/**

  deep-nightly:
    name: deep nightly checks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Resolve project root
        id: project-root
        run: |
          if [[ -d trust && -f trust/Makefile ]]; then
            echo "dir=trust" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Install deep dependencies
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Full pytest suite
        working-directory: ${{ steps.project-root.outputs.dir }}
        run: pytest -q --maxfail=1
