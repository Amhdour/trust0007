<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1600" role="img" aria-labelledby="title desc">
  <title id="title">GITEX Africa 2026 shortlist recognition proof</title>
  <desc id="desc">Certificate-style recognition poster for Ahmed Amhdour, shortlisted for the GITEX Africa 2026 Cyber and AI Achiever Awards Rising Star category.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160405"/>
      <stop offset="45%" stop-color="#4b0909"/>
      <stop offset="100%" stop-color="#140202"/>
    </linearGradient>
    <radialGradient id="burst" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#ffcf7a" stop-opacity="0.40"/>
      <stop offset="45%" stop-color="#ad2e0d" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9eedf"/>
      <stop offset="100%" stop-color="#dfc4a4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0bf"/>
      <stop offset="20%" stop-color="#f4c86d"/>
      <stop offset="55%" stop-color="#c98b2f"/>
      <stop offset="100%" stop-color="#8a5115"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3d0"/>
      <stop offset="100%" stop-color="#c4882e"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25080c"/>
      <stop offset="50%" stop-color="#4c1217"/>
      <stop offset="100%" stop-color="#21070a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1080" height="1600" fill="url(#bg)"/>
  <rect width="1080" height="1600" fill="url(#burst)"/>

  <g opacity="0.55" fill="#f5a53a">
