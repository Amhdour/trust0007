      <rect x="138" y="0" width="116" height="92" rx="10" fill="#23070a" stroke="#a66f2d" stroke-width="2"/>
      <rect x="276" y="0" width="116" height="92" rx="10" fill="#23070a" stroke="#a66f2d" stroke-width="2"/>
      <rect x="414" y="0" width="170" height="92" rx="10" fill="#23070a" stroke="#a66f2d" stroke-width="2"/>
      <text x="58" y="34" fill="#f5d48d" font-size="14" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="700">KINGDOM OF</text>
      <text x="58" y="58" fill="#f5d48d" font-size="14" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="700">MOROCCO</text>
      <text x="196" y="46" fill="#f5d48d" font-size="14" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="700">LOCAL PARTNER</text>
      <text x="334" y="46" fill="#f5d48d" font-size="14" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="700">DIGITAL AGENCY</text>
      <text x="499" y="34" fill="#f5d48d" font-size="14" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="700">ORGANISED BY</text>
      <text x="499" y="58" fill="#fff2d2" font-size="26" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="700">KAOUN</text>
      <text x="499" y="80" fill="#fff2d2" font-size="14" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="700">INTERNATIONAL</text>
