    <circle cx="130" cy="128" r="3"/>
    <circle cx="181" cy="64" r="4"/>
    <circle cx="264" cy="90" r="6"/>
    <circle cx="1012" cy="116" r="5"/>
    <circle cx="944" cy="164" r="3"/>
    <circle cx="882" cy="76" r="4"/>
    <circle cx="828" cy="126" r="6"/>
    <circle cx="180" cy="1406" r="4"/>
    <circle cx="266" cy="1472" r="5"/>
    <circle cx="910" cy="1422" r="4"/>
    <circle cx="1004" cy="1494" r="6"/>
    <circle cx="70" cy="1212" r="3"/>
    <circle cx="142" cy="1246" r="5"/>
    <circle cx="970" cy="1244" r="4"/>
